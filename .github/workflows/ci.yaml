
name: CA2mlops CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test application imports
        run: python -c "from app import app; print('FastAPI app loaded successfully')"

      - name: Build Docker image
        run: docker build -t ca2mlops-api .
